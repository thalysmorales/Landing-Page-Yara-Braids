<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | Yara Braids</title>

    <!-- Pede aos buscadores para NÃO indexar esta página.
         (O robots.txt com "Disallow: /admin" é um segundo aviso. Nenhum dos dois é
         segurança: quem protege a agenda é a senha verificada no servidor.) -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#142B3B">

    <!-- Mesma fonte do site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Flatpickr com VERSÃO FIXA (4.6.13): uma atualização futura da biblioteca não muda o comportamento sem você saber -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">

    <link rel="icon" type="image/png" href="img/yara-braids-favicon-512.png">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="pagina">

        <!-- Topo no mesmo estilo da barra de navegação do site -->
        <header class="topo">
            <img src="img/logo.png" alt="Logo Yara Braids">
            <!-- O botão Sair só aparece depois do login (o admin.js controla isso) -->
            <button type="button" class="botaoSair" id="botaoSair" hidden>Sair</button>
        </header>

        <main>
            <!-- ===== TELA 1: SENHA ===== -->
            <section class="cartao cartaoLogin" id="telaLogin" aria-labelledby="tituloLogin">
                <h1 id="tituloLogin">Minha agenda</h1>
                <p>Digite a senha para ver e organizar os seus dias.</p>

                <form id="formLogin" novalidate>
                    <label for="campoSenha">Senha</label>
                    <!-- autocomplete="off": pedimos ao navegador para não oferecer guardar a senha -->
                    <input type="password" id="campoSenha" autocomplete="off" autocapitalize="off" spellcheck="false">
                    <p class="mensagemErro" id="erroLogin" role="alert" aria-live="assertive"></p>
                    <button type="submit" class="botaoPrincipal" id="botaoEntrar">Entrar</button>
                </form>
            </section>

            <!-- ===== TELA 2: CALENDÁRIO ===== -->
            <section class="cartao cartaoPainel" id="telaPainel" aria-labelledby="tituloPainel" hidden>
                <div class="painelTopo">
                    <div>
                        <h1 id="tituloPainel">Agenda</h1>
                        <p>Toque em um dia para mudar: livre, bloqueado, agendado e de novo livre.</p>
                    </div>
                    <!-- Mostra "Salvando...", "Salvo" ou "Erro ao salvar" -->
                    <p class="indicador" id="indicador" data-estado="salvo" role="status" aria-live="polite">Salvo</p>
                </div>

                <ul class="legenda" aria-label="Legenda">
                    <li><span class="amostra amostraLivre">12</span> Livre</li>
                    <li><span class="amostra amostraBloqueado">12</span> Bloqueado (não trabalho)</li>
                    <li><span class="amostra amostraAgendado">12</span> Agendado (já tem cliente)</li>
                    <li><span class="amostra amostraPassado">12</span> Dia passado</li>
                </ul>

                <p class="mensagemErro" id="avisoPainel" role="alert" aria-live="assertive"></p>

                <!-- O Flatpickr desenha o calendário logo depois deste campo (modo inline) -->
                <div class="calendarioBox">
                    <input type="text" id="campoCalendario" hidden>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/pt.js"></script>
    <script src="admin.js"></script>
</body>

</html>
